name: Deploy Trung Thu Cho Em

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Do NOT cancel an in-progress video conversion/download
# when another commit is pushed.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static card
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---------------------------------------------------
      # Restore videos generated/downloaded by older
      # successful workflow runs.
      #
      # Repo files remain too; cache is just an extra layer.
      # ---------------------------------------------------
      - name: Restore prepared video cache
        uses: actions/cache@v6
        with:
          path: |
            assets/video/nam2025
            assets/video/nam2026
          key: prepared-videos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            prepared-videos-${{ runner.os }}-

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version | head -n 1

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install \
            "gdown>=6.1,<7" \
            "beautifulsoup4>=4.12,<5"

      - name: Validate website files
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f style.css
          test -f script.js
          test -d assets
          test -f scripts/download_drive_videos.py

      - name: Check existing then prepare Drive videos
        shell: bash
        run: |
          set -euo pipefail

          python scripts/download_drive_videos.py

      - name: Show prepared videos
        shell: bash
        run: |
          set -euo pipefail

          echo "Prepared videos:"
          find assets/video -type f -print 2>/dev/null | sort || true

          echo ""
          echo "Video size:"
          du -sh assets/video 2>/dev/null || true

      - name: Prepare final card
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp style.css _site/
          cp script.js _site/
          cp -R assets _site/assets

          if [ -f favicon.ico ]; then
            cp favicon.ico _site/
          fi

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest _site/
          fi

          if [ -f robots.txt ]; then
            cp robots.txt _site/
          fi

          touch _site/.nojekyll

          echo "Final site size:"
          du -sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload final card artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy final card
    runs-on: ubuntu-24.04
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
