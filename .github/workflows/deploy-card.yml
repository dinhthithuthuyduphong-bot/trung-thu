name: Deploy Trung Thu Cho Em

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  MEDIA_TAG: media-v1

jobs:
  build:
    name: Build lightweight card
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install HTML parser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "beautifulsoup4>=4.12,<5"
      - name: Read permanent release media list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${MEDIA_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release view "${MEDIA_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' > release-assets.txt
          else
            echo "::warning::Release ${MEDIA_TAG} does not exist yet. Run 'Prepare Video Media Once' first."
            : > release-assets.txt
          fi
          echo "Release media count: $(wc -l < release-assets.txt)"
      - name: Point 2025 and 2026 videos to permanent release
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rewrite_release_media_urls.py \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${MEDIA_TAG}" \
            --assets-file release-assets.txt
      - name: Validate website files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f style.css
          test -f script.js
          test -d assets
          test -f scripts/rewrite_release_media_urls.py
      - name: Prepare lightweight final card
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/
          cp style.css _site/
          cp script.js _site/
          rsync -a \
            --exclude='/video/nam2025/' \
            --exclude='/video/nam2026/' \
            assets/ _site/assets/
          if [ -f favicon.ico ]; then cp favicon.ico _site/; fi
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest _site/; fi
          if [ -f robots.txt ]; then cp robots.txt _site/; fi
          touch _site/.nojekyll
          echo "Final lightweight site size:"
          du -sh _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload lightweight site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy final card
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
