name: Deploy Trung Thu Cho Em

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static card
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # 3. FFMPEG
      # MOV -> MP4 H.264 + AAC
      # =====================================================
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

      # =====================================================
      # 4. PYTHON DEPENDENCIES
      # =====================================================
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # 5. VALIDATE SOURCE WEBSITE
      # =====================================================
      - name: Validate website files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required files..."

          test -f index.html || {
            echo "ERROR: index.html not found at repository root"
            exit 1
          }

          test -f style.css || {
            echo "ERROR: style.css not found at repository root"
            exit 1
          }

          test -f script.js || {
            echo "ERROR: script.js not found at repository root"
            exit 1
          }

          test -d assets || {
            echo "ERROR: assets/ folder not found at repository root"
            exit 1
          }

          test -f requirements.txt || {
            echo "ERROR: requirements.txt not found"
            exit 1
          }

          test -f scripts/download_drive_videos.py || {
            echo "ERROR: scripts/download_drive_videos.py not found"
            exit 1
          }

          echo "Website structure looks good."

      # =====================================================
      # 6. DOWNLOAD + CONVERT DRIVE VIDEOS
      #
      # Reads only the mapped 2025/2026 video blocks in index.html.
      # 2024 is untouched.
      #
      # - Download public Drive folders.
      # - Keep Drive filenames.
      # - Convert MOV -> MP4 H.264/AAC.
      # - Match by filename stem only (ignore extension/case).
      # - Update the CI copy of index.html to the real .mp4/.etc path.
      # =====================================================
      - name: Download and prepare Drive videos
        shell: bash
        run: |
          set -euo pipefail

          python scripts/download_drive_videos.py

      # =====================================================
      # 7. SHOW FINAL VIDEO TREE
      # =====================================================
      - name: Check prepared videos
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "Prepared videos:"
          find assets/video -type f -print 2>/dev/null | sort || true

          echo ""
          echo "Video disk usage:"
          du -sh assets/video 2>/dev/null || true

      # =====================================================
      # 8. PREPARE FINAL CARD
      # =====================================================
      - name: Prepare final card
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp style.css _site/
          cp script.js _site/
          cp -R assets _site/assets

          if [ -f favicon.ico ]; then
            cp favicon.ico _site/
          fi

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest _site/
          fi

          if [ -f robots.txt ]; then
            cp robots.txt _site/
          fi

          touch _site/.nojekyll

          echo ""
          echo "Final card contents:"
          find _site -maxdepth 6 -type f | sort

          echo ""
          echo "Final site size:"
          du -sh _site

      # =====================================================
      # 9. GITHUB PAGES
      # =====================================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload final card artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy final card
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
